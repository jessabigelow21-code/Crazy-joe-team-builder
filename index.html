<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Alliance HQ — Crazy Joe</title><style>
:root{--bg:#0d0e10;--p:#18191d;--p2:#23252b;--line:#383b43;--txt:#f7f7f8;--mut:#b8bac2;--gold:#d6b36d;--green:#4ed18a;--amber:#f2bd56;--blue:#7eafff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b0c0e,#13151a);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:12px 12px 90px}header{position:sticky;top:0;z-index:4;background:#0d0e10ee;backdrop-filter:blur(10px);padding:11px 0;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0}small,.muted{color:var(--mut)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tab,.btn{border:1px solid var(--line);background:var(--p2);color:var(--txt);padding:11px;border-radius:11px;font-weight:800}.tab.active,.primary{background:linear-gradient(#e0c080,#b88b3e);color:#17120a;border-color:#eed59f}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:12px}.card h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:var(--mut)}input,select{width:100%;margin-top:5px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--txt)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:var(--p2);border:1px solid var(--line);padding:9px;border-radius:11px;text-align:center}.stat b{display:block;font-size:19px}.roster{display:grid;gap:7px;max-height:56vh;overflow:auto}.player{display:grid;grid-template-columns:38px 1fr auto auto;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--line);padding:8px;border-radius:11px}.member{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--line);padding:8px;border-radius:11px}.rank{width:34px;height:34px;border-radius:9px;background:#111216;color:var(--gold);display:grid;place-items:center;font-weight:900}.name{font-weight:750;overflow-wrap:anywhere}.status{border:0;border-radius:999px;min-width:70px;padding:8px;font-weight:900}.off{background:#383a41;color:#ddd}.bt{border:0;border-radius:999px;min-width:54px;padding:8px;font-weight:900}.bt0{background:#34363d;color:#c7c9cf}.bt1{background:#173858;color:#9bcaff}.bt2{background:#4a254f;color:#efb0fa}.yes{background:#173f2c;color:#90f0bd}.sub{background:#4b3816;color:#ffd37c}.actions{position:sticky;bottom:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.hidden{display:none!important}.teamgrid{display:grid;gap:10px}.team{background:var(--p);border:1px solid var(--line);border-radius:15px;overflow:hidden}.teamhead{display:flex;justify-content:space-between;padding:11px 12px;background:#211d15;border-bottom:1px solid #5e4a26}.teamhead h3{margin:0;color:#ffe0a0}.meta{font-size:12px;color:#d5c39e;text-align:right}.members{display:grid;gap:7px;padding:8px}.member.selected{outline:2px solid var(--blue)}.swap{border:0;background:transparent;color:var(--mut)}.subline{margin:0 8px 8px;border:1px dashed #6b5428;background:#221d13;padding:9px;border-radius:10px;color:#ffe1a3}.balance{background:#153526;border:1px solid #286847;color:#abf2ca;padding:11px;border-radius:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:white;color:#111;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}@media(min-width:700px){.roster,.teamgrid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header><h1>Alliance HQ</h1><small>Crazy Joe Mobile Team Builder • CAN 2578</small><div class="tabs"><button id="selectTab" class="tab active">1. Select Players</button><button id="teamsTab" class="tab">2. Teams</button></div></header>
<section id="selectView"><div class="card"><h2>Event setup</h2><div class="grid"><label>Event time<select id="eventTime"><option>15:00 UTC</option><option>20:00 UTC</option></select></label><label>Players per team<select id="teamSize"><option selected>6</option><option>5</option><option>7</option><option>8</option></select></label><label>Date<input type="date" id="eventDate"></label><label>Team count<input disabled id="teamCount"></label></div><div class="stats"><div class="stat"><b id="yc">0</b><span>YES</span></div><div class="stat"><b id="sc">0</b><span>SUBS</span></div><div class="stat"><b id="oc">91</b><span>OFF</span></div></div></div>
<div class="card"><h2>Set status and Bear Trap location</h2><div class="grid"><input id="search" placeholder="Search player…"><button class="btn" id="reset">Reset all</button></div><p class="muted">Tap status: OFF → YES → SUB. Tap BT: — → BT1 → BT2. Gaia Heart rank #1 is strongest.</p><div class="roster" id="roster"></div></div><div class="actions"><button class="btn" id="save">Save Progress</button><button class="btn primary" id="generate">Generate Teams</button></div></section>

<script>const roster=[{"name":"AngryMarshmallow","rank":1},{"name":"Asuka","rank":2},{"name":"Lucky Meow","rank":3},{"name":"Dr.CutyRose","rank":4},{"name":"SmittySlaps","rank":5},{"name":"Bun","rank":6},{"name":"Space_balls","rank":7},{"name":"Cute BRS","rank":8},{"name":"Hedder","rank":9},{"name":"Rellik","rank":10},{"name":"MatDNK","rank":11},{"name":"BuRyAbAy","rank":12},{"name":"Kals Avarys","rank":13},{"name":"Kkoma","rank":14},{"name":"Brother Yatty","rank":15},{"name":"Ntina","rank":16},{"name":"YahuKimo","rank":17},{"name":"Choppy","rank":18},{"name":"Tara","rank":19},{"name":"Eurokeith","rank":20},{"name":"Summer","rank":21},{"name":"Seal","rank":22},{"name":"Fu2fa2","rank":23},{"name":"Cat","rank":24},{"name":"Filip1031","rank":25},{"name":"Lord McLord","rank":26},{"name":"Ibra","rank":27},{"name":"Dr.cutyMomo","rank":28},{"name":"SKY","rank":29},{"name":"Tembakau ACEH","rank":30},{"name":"Soraa","rank":31},{"name":"ReyGattuso","rank":32},{"name":"Spike","rank":33},{"name":"Floopy","rank":34},{"name":"Black Rooster","rank":35},{"name":"Batavia","rank":36},{"name":"Ranji","rank":37},{"name":"Seren","rank":38},{"name":"Yaya_Bings","rank":39},{"name":"WINGJACK","rank":40},{"name":"U Chicken Me","rank":41},{"name":"Psycho","rank":42},{"name":"Tdvt25","rank":43},{"name":"Lord Vegnagun","rank":44},{"name":"Lilyballs","rank":45},{"name":"Caterpillar (tired)","rank":46},{"name":"NicolePharmD","rank":47},{"name":"Kidbull x suzume","rank":48},{"name":"Kuman","rank":49},{"name":"AZOZKA","rank":50},{"name":"Lexie","rank":51},{"name":"Blank","rank":52},{"name":"Meli","rank":53},{"name":"Melonlord","rank":54},{"name":"Ratchin","rank":55},{"name":"Doom Balls","rank":56},{"name":"SOGEKING","rank":57},{"name":"Bani Adam","rank":58},{"name":"Wolf Pup","rank":59},{"name":"Shoushana","rank":60},{"name":"Swirl Koi","rank":61},{"name":"Vrekmontt","rank":62},{"name":"SHDW","rank":63},{"name":"RANGERS","rank":64},{"name":"Nebulese","rank":65},{"name":"SteelCityInsider","rank":66},{"name":"Wildkid","rank":67},{"name":"Punni","rank":68},{"name":"Timmu","rank":69},{"name":"Atiba","rank":70},{"name":"DODGE06","rank":71},{"name":"Kayzersoze77","rank":72},{"name":"VKdViKing","rank":73},{"name":"Mana","rank":74},{"name":"Euphoria","rank":75},{"name":"Durzu","rank":76},{"name":"Gritsayenko","rank":77},{"name":"Noura","rank":78},{"name":"JC","rank":79},{"name":"Chuso Faawk","rank":80},{"name":"Deus Caeli","rank":81},{"name":"Sukuna","rank":82},{"name":"DonMeloooon","rank":83},{"name":"Shore enough","rank":84},{"name":"Biiiiiiiiing~O","rank":85},{"name":"SHIBUYA","rank":86},{"name":"Fatchuck7","rank":87},{"name":"Doomsday","rank":88},{"name":"Pukie","rank":89},{"name":"fckck","rank":90},{"name":"DarthVader","rank":91}],KEY='allianceHQcj3';let st=Object.fromEntries(roster.map(p=>[p.name,'off'])),bt=Object.fromEntries(roster.map(p=>[p.name,''])),teams=[],subs=[],teamBT=[],teamLabels=[],pick=null;const q=s=>document.querySelector(s);q('#eventDate').value=new Date().toISOString().slice(0,10);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function toast(s){let t=q('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}function save(){localStorage.setItem(KEY,JSON.stringify({st,bt,teams,subs,teamBT,teamLabels,time:q('#eventTime').value,date:q('#eventDate').value,size:q('#teamSize').value}))}function counts(){let v=Object.values(st),y=v.filter(x=>x==='yes').length,s=v.filter(x=>x==='sub').length;q('#yc').textContent=y;q('#sc').textContent=s;q('#oc').textContent=roster.length-y-s;let sz=+q('#teamSize').value,b1=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT1').length,b2=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT2').length;q('#teamCount').value=(b1?Math.ceil(b1/sz):0)+(b2?Math.ceil(b2/sz):0);save()}function renderRoster(){let z=q('#search').value.toLowerCase(),b=q('#roster');b.innerHTML='';roster.filter(p=>p.name.toLowerCase().includes(z)).forEach(p=>{let d=document.createElement('div'),x=st[p.name],loc=bt[p.name]||'';d.className='player';d.innerHTML=`<div class="rank">${p.rank}</div><div class="name">${esc(p.name)}</div><button class="bt ${loc==='BT1'?'bt1':loc==='BT2'?'bt2':'bt0'}">${loc||'— BT'}</button><button class="status ${x}">${x==='off'?'OFF':x.toUpperCase()}</button>`;d.querySelector('.status').onclick=()=>{st[p.name]={off:'yes',yes:'sub',sub:'off'}[x];renderRoster();counts()};d.querySelector('.bt').onclick=()=>{bt[p.name]={'':'BT1','BT1':'BT2','BT2':''}[loc];renderRoster();counts()};b.appendChild(d)})}function score(t){return t.reduce((a,p)=>a+p.rank,0)}function optimizeGroup(ts){for(let z=0;z<250;z++){let sums=ts.map(score),before=Math.max(...sums)-Math.min(...sums),done=false;outer:for(let a=0;a<ts.length;a++)for(let b=a+1;b<ts.length;b++)for(let i=0;i<ts[a].length;i++)for(let j=0;j<ts[b].length;j++){let test=sums.slice();test[a]=sums[a]-ts[a][i].rank+ts[b][j].rank;test[b]=sums[b]-ts[b][j].rank+ts[a][i].rank;if(Math.max(...test)-Math.min(...test)<before){[ts[a][i],ts[b][j]]=[ts[b][j],ts[a][i]];done=true;break outer}}if(!done)break}ts.forEach(t=>t.sort((a,b)=>a.rank-b.rank))}function buildPool(players,location,size){if(!players.length)return {ts:[],ss:[],labels:[]};let n=Math.ceil(players.length/size),ts=Array.from({length:n},()=>[]);players.sort((a,b)=>a.rank-b.rank).forEach((p,i)=>{let row=Math.floor(i/n),col=i%n,idx=row%2?n-1-col:col;ts[idx].push(p)});optimizeGroup(ts);return {ts,ss:Array.from({length:n},()=>[]),labels:ts.map((_,i)=>`${location} TEAM ${i+1}`)}}function generate(){let selected=roster.filter(p=>st[p.name]!=='off'),missing=selected.filter(p=>!bt[p.name]);if(missing.length){alert('Assign BT1 or BT2 to:\n\n'+missing.map(p=>p.name).join('\n'));return false}let size=+q('#teamSize').value,y1=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT1'),y2=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT2'),s1=roster.filter(p=>st[p.name]==='sub'&&bt[p.name]==='BT1'),s2=roster.filter(p=>st[p.name]==='sub'&&bt[p.name]==='BT2');if(y1.length+y2.length<2)return toast('Select at least 2 YES players'),false;let a=buildPool(y1,'BT1',size),b=buildPool(y2,'BT2',size);s1.forEach((p,i)=>a.ss.length&&a.ss[i%a.ss.length].push(p));s2.forEach((p,i)=>b.ss.length&&b.ss[i%b.ss.length].push(p));teams=[...a.ts,...b.ts];subs=[...a.ss,...b.ss];teamBT=[...a.ts.map(()=> 'BT1'),...b.ts.map(()=> 'BT2')];teamLabels=[...a.labels,...b.labels];pick=null;renderTeams();save();return true}function renderTeams(){let b=q('#teamGrid');b.innerHTML='';let sums=teams.map(score),avg=sums.reduce((a,c)=>a+c,0)/sums.length,spread=Math.max(...sums)-Math.min(...sums),pct=(spread/avg*100).toFixed(1);q('#balance').innerHTML=`<b>BT1 and BT2 are kept separate</b><br>${teams.length} total teams • Players only swap within the same Bear Trap group.`;teams.forEach((t,ti)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<div class="teamhead"><h3>${teamLabels[ti]||((teamBT[ti]||'BT')+' TEAM '+(ti+1))}</h3><div class="meta">Rank sum: ${score(t)}<br>Avg rank: ${(score(t)/t.length).toFixed(1)}</div></div><div class="members"></div>`;let m=d.querySelector('.members');t.forEach((p,pi)=>{let r=document.createElement('div');r.className='member'+(pick&&pick.ti===ti&&pick.pi===pi?' selected':'');r.innerHTML=`<div class="rank">${p.rank}</div><div class="name">${esc(p.name)}</div><button class="swap">Swap</button>`;r.onclick=()=>swap(ti,pi);m.appendChild(r)});let sl=document.createElement('div');sl.className='subline';sl.innerHTML=`<b>SUB${subs[ti]?.length===1?'':'S'}:</b> ${subs[ti]?.length?subs[ti].map(x=>esc(x.name)).join(', '):'None assigned'}`;d.appendChild(sl);b.appendChild(d)})}function swap(ti,pi){if(!pick){pick={ti,pi};renderTeams();return toast('Tap a player on another team')}if(pick.ti===ti){pick=null;return renderTeams()}if(teamBT[pick.ti]!==teamBT[ti]){pick=null;renderTeams();return toast('BT1 and BT2 players cannot be swapped')}[teams[pick.ti][pick.pi],teams[ti][pi]]=[teams[ti][pi],teams[pick.ti][pick.pi]];teams[pick.ti].sort((a,b)=>a.rank-b.rank);teams[ti].sort((a,b)=>a.rank-b.rank);pick=null;renderTeams();save();toast('Players swapped')}function show(which){q('#selectView').classList.toggle('hidden',which==='teams');q('#teamsView').classList.toggle('hidden',which!=='teams');q('#selectTab').classList.toggle('active',which!=='teams');q('#teamsTab').classList.toggle('active',which==='teams');scrollTo(0,0)}function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;st={...st,...d.st};bt={...bt,...(d.bt||{})};teams=d.teams||[];subs=d.subs||[];teamBT=d.teamBT||[];teamLabels=d.teamLabels||[];if(d.time)q('#eventTime').value=d.time;if(d.date)q('#eventDate').value=d.date;if(d.size)q('#teamSize').value=d.size}catch(e){}}function copy(){let out=`🔥 CRAZY JOE TEAMS 🔥
${q('#eventDate').value} • ${q('#eventTime').value}
`;teams.forEach((t,i)=>{out+=`\n⚔️ ${teamLabels[i]||((teamBT[i]||'BT')+' TEAM '+(i+1))}\n`;t.forEach(p=>out+=`• ${p.name}
`);out+=`SUB${subs[i]?.length===1?'':'S'}: ${subs[i]?.length?subs[i].map(x=>x.name).join(', '):'None'}
`});navigator.clipboard.writeText(out).then(()=>toast('Teams copied')).catch(()=>prompt('Copy teams:',out))}q('#search').oninput=renderRoster;q('#teamSize').onchange=counts;q('#save').onclick=()=>{save();toast('Progress saved')};q('#generate').onclick=()=>{if(generate())show('teams')};q('#rebalance').onclick=()=>{generate();toast('Rebalanced')};q('#back').onclick=()=>show('select');q('#selectTab').onclick=()=>show('select');q('#teamsTab').onclick=()=>teams.length?show('teams'):toast('Generate teams first');q('#copy').onclick=copy;q('#reset').onclick=()=>{if(confirm('Clear all selections?')){st=Object.fromEntries(roster.map(p=>[p.name,'off']));bt=Object.fromEntries(roster.map(p=>[p.name,'']));teams=[];subs=[];teamBT=[];teamLabels=[];save();renderRoster();counts()}};load();renderRoster();counts();</script></body></html>
